app = 'monitor-diarios'
primary_region = 'gru'

[build]
[env]
  RUST_LOG = 'info,monitor_diarios=info'
  MONITOR_KEYWORDS = '+pregao +eletronico,+dispensa +licitacao'
  MONITOR_TERRITORIES = '4106902,3304557,2927408,2611606'
  MONITOR_FAMURS_ENTITIES = '64462'
  MONITOR_DATAJUD_API_KEY = 'APIKey cDZHYzlZa0JadVREZDJCendQbXY6SkJlTzNjLV9TRENyQk1RdnFKZGRQdw=='
  MONITOR_PROCESSOS = 'stj:00011552020248272734:REsp exemplo'



[[mounts]]
  source = 'monitor_data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '2m0s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
